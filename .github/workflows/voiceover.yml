name: Test Chatterbox Nano voiceover
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voiceover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-voiceover.txt
      - name: Install CPU dependencies
        run: bash scripts/setup_voiceover.sh
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate narration and metrics
        run: python scripts/generate_voiceover.py
      - name: Upload audio and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatterbox-nano-voiceover-${{ github.run_id }}
          path: artifacts/voiceover/
          if-no-files-found: warn
          retention-days: 14
